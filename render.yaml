services:
  - type: web
    name: scaleafrique-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: scaleafrique-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: REDIS_ENABLED
        value: false
      - key: FRONTEND_URL
        value: https://frontend-one-jet-63.vercel.app

databases:
  - name: scaleafrique-db
    plan: free
    databaseName: scaleafrique
